<!DOCTYPE html>
<html>
<head>
    <title>Fitness Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 25px;
            width: 180px;
            border-radius: 15px;
            box-shadow: 0 3px 10px #ccc;
        }

        .value {
            font-size: 30px;
            font-weight: bold;
            margin: 15px;
        }
    </style>
</head>

<body>

    <h1>🏃 Fitness Tracker</h1>
    <p>Track your daily fitness activities</p>

    <div class="container">

        <div class="card">
            <h3>Steps</h3>
            <div class="value">7,520</div>
            <p>steps today</p>
        </div>

        <div class="card">
            <h3>Calories</h3>
            <div class="value">420</div>
            <p>kcal burned</p>
        </div>

        <div class="card">
            <h3>Water</h3>
            <div class="value">1.8 L</div>
            <p>water intake</p>
        </div>

        <div class="card">
            <h3>Weight</h3>
            <div class="value">50 kg</div>
            <p>current weight</p>
        </div>

    </div>

</body>
</html>
