<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #10b981; --primary-dark: #059669;
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b;
            --border: #e2e8f0; --orange: #f97316; --blue: #0284c7; --purple: #6366f1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        .logo { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
        .btn { padding: 0.5rem 1rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: white; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: #f1f5f9; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1.25rem; margin-bottom: 2rem; }
        .card { background: var(--card); border-radius: 14px; padding: 1.25rem; border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .card h3 { font-size: 0.9rem; color: var(--muted); text-transform: uppercase; margin-bottom: 0.5rem; display: flex; justify-content: space-between; }
        .card .value { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.25rem; }
        .card .sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.75rem; }
        .bar-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-bottom: 0.75rem; }
        .bar-fill { height: 100%; border-radius: 99px; transition: 0.4s; }
        .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.5rem; }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
        @media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } }
        .item-list { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1rem; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 0.65rem 0.85rem; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; }
        .del-btn { background: none; border: none; cursor: pointer; color: #ef4444; font-size: 1rem; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 99; padding: 1rem; }
        .modal.active { display: flex; }
        .modal-box { background: white; padding: 1.5rem; border-radius: 16px; width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.3rem; }
        .form-group input, .form-group select { width: 100%; padding: 0.55rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">ðŸƒ Fitness Tracker Pro</div>
        <div>
            <button class="btn btn-primary" onclick="openModal('modalWorkout')">+ Log Workout</button>
            <button class="btn btn-outline" onclick="resetData()">ðŸ”„ Reset</button>
        </div>
    </header>

    <!-- 4 Core Metric Cards -->
    <div class="grid">
        <!-- Steps -->
        <div class="card">
            <h3><span>Steps</span> <span id="pctSteps" style="color:var(--primary)">75%</span></h3>
            <div class="value" id="valSteps">7,520</div>
            <div class="sub">Goal: 10,000 steps</div>
            <div class="bar-bg"><div class="bar-fill" id="barSteps" style="width:75%; background:var(--primary);"></div></div>
            <div class="actions">
                <button class="btn btn-outline btn-sm" onclick="addSteps(500)">+500</button>
                <button class="btn btn-outline btn-sm" onclick="addSteps(1000)">+1,000</button>
                <button class="btn btn-outline btn-sm" onclick="promptSteps()">Custom</button>
            </div>
        </div>

        <!-- Calories -->
        <div class="card">
            <h3><span>Calories</span> <span id="pctCalories" style="color:var(--orange)">84%</span></h3>
            <div class="value" id="valCalories">420</div>
            <div class="sub">Goal: 500 kcal burned</div>
            <div class="bar-bg"><div class="bar-fill" id="barCalories" style="width:84%; background:var(--orange);"></div></div>
            <div class="actions">
                <button class="btn btn-outline btn-sm" style="width:100%" onclick="openModal('modalWorkout')">+ Log Workout</button>
            </div>
        </div>

        <!-- Water -->
        <div class="card">
            <h3><span>Water</span> <span id="pctWater" style="color:var(--blue)">72%</span></h3>
            <div class="value" id="valWater">1.8 L</div>
            <div class="sub">Goal: 2.5 L intake</div>
            <div class="bar-bg"><div class="bar-fill" id="barWater" style="width:72%; background:var(--blue);"></div></div>
            <div class="actions">
                <button class="btn btn-outline btn-sm" onclick="addWater(250)">+250ml</button>
                <button class="btn btn-outline btn-sm" onclick="addWater(500)">+500ml</button>
                <button class="btn btn-outline btn-sm" onclick="addWater(750)">+750ml</button>
            </div>
        </div>

        <!-- Weight & BMI -->
        <div class="card">
            <h3><span>Weight</span> <span id="badgeBMI" style="color:var(--purple); font-weight:700;">BMI 19.5</span></h3>
            <div class="value" id="valWeight">50 kg</div>
            <div class="sub">Normal healthy weight range</div>
            <div class="bar-bg"><div class="bar-fill" style="width:100%; background:var(--purple);"></div></div>
            <div class="actions">
                <button class="btn btn-outline btn-sm" style="width:100%" onclick="updateWeightPrompt()">âš–ï¸ Update Weight</button>
            </div>
        </div>
    </div>

    <!-- Charts & Workouts Section -->
    <div class="two-col">
        <!-- 7-Day Chart -->
        <div class="card">
            <h3 style="margin-bottom: 1rem;">ðŸ“Š 7-Day Activity Trend (Steps)</h3>
            <div style="height: 250px;"><canvas id="chartSteps"></canvas></div>
        </div>

        <!-- Recent Workouts -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0;">ðŸƒ Today's Workouts</h3>
                <button class="btn btn-primary btn-sm" onclick="openModal('modalWorkout')">+ Add</button>
            </div>
            <div class="item-list" id="workoutList"></div>
        </div>
    </div>

    <!-- Workout Modal -->
    <div class="modal" id="modalWorkout">
        <div class="modal-box">
            <h3 style="margin-bottom: 1rem;">ðŸ”¥ Log Workout</h3>
            <form id="workoutForm">
                <div class="form-group">
                    <label>Activity Type</label>
                    <select id="wType">
                        <option value="Running">ðŸƒ Running</option>
                        <option value="Cycling">ðŸš´ Cycling</option>
                        <option value="Gym / Weights">ðŸ‹ï¸ Gym / Weights</option>
                        <option value="Yoga">ðŸ§˜ Yoga</option>
                        <option value="Swimming">ðŸŠ Swimming</option>
                        <option value="Walking">ðŸš¶ Walking</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Duration (Minutes)</label>
                    <input type="number" id="wDuration" value="30" min="1" required>
                </div>
                <div class="form-group">
                    <label>Calories Burned (kcal)</label>
                    <input type="number" id="wCalories" value="250" min="1" required>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                    <button type="button" class="btn btn-outline" onclick="closeModal('modalWorkout')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Workout</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const KEY = 'fitnesstracker_mini_v1';
        let state = JSON.parse(localStorage.getItem(KEY)) || {
            steps: 7520, waterMl: 1800, weight: 50, height: 160,
            workouts: [
                { id: 1, title: 'Morning Jogging', duration: 25, calories: 240, time: '07:30 AM' },
                { id: 2, title: 'Yoga & Stretch', duration: 35, calories: 180, time: '11:15 AM' }
            ]
        };

        function save() { localStorage.setItem(KEY, JSON.stringify(state)); updateUI(); }

        function updateUI() {
            // Steps
            const sPct = Math.min(Math.round((state.steps / 10000) * 100), 100);
            document.getElementById('valSteps').textContent = state.steps.toLocaleString();
            document.getElementById('barSteps').style.width = sPct + '%';
            document.getElementById('pctSteps').textContent = sPct + '%';

            // Calories
            const totalCals = state.workouts.reduce((s, w) => s + Number(w.calories), 0);
            const cPct = Math.min(Math.round((totalCals / 500) * 100), 100);
            document.getElementById('valCalories').textContent = totalCals.toLocaleString();
            document.getElementById('barCalories').style.width = cPct + '%';
            document.getElementById('pctCalories').textContent = cPct + '%';

            // Water
            const wPct = Math.min(Math.round((state.waterMl / 2500) * 100), 100);
            document.getElementById('valWater').textContent = (state.waterMl / 1000).toFixed(1) + ' L';
            document.getElementById('barWater').style.width = wPct + '%';
            document.getElementById('pctWater').textContent = wPct + '%';

            // Weight & BMI
            const bmi = Math.round((state.weight / Math.pow(state.height / 100, 2)) * 10) / 10;
            document.getElementById('valWeight').textContent = state.weight + ' kg';
            document.getElementById('badgeBMI').textContent = `BMI ${bmi} (Normal)`;

            // Workouts List
            const list = document.getElementById('workoutList');
            if (state.workouts.length === 0) {
                list.innerHTML = '<p style="color:var(--muted); font-size:0.85rem;">No workouts logged today.</p>';
            } else {
                list.innerHTML = state.workouts.map(w => `
                    <div class="item">
                        <div>
                            <strong>${w.title}</strong>
                            <div style="font-size:0.75rem; color:var(--muted);">${w.duration} min â€¢ ${w.time}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:0.75rem;">
                            <span style="font-weight:700; color:var(--orange);">+${w.calories} kcal</span>
                            <button class="del-btn" onclick="delWorkout(${w.id})">ðŸ—‘ï¸</button>
                        </div>
                    </div>
                `).join('');
            }

            renderChart();
        }

        function addSteps(n) { state.steps += n; save(); }
        function promptSteps() { const val = prompt("Enter steps to add:", "1000"); if (val) addSteps(Number(val) || 0); }
        function addWater(ml) { state.waterMl += ml; save(); }
        function updateWeightPrompt() { const val = prompt("Enter current weight (kg):", state.weight); if (val) { state.weight = Number(val) || state.weight; save(); } }
        function delWorkout(id) { state.workouts = state.workouts.filter(w => w.id !== id); save(); }
        function resetData() { if (confirm("Reset to default data?")) { localStorage.removeItem(KEY); location.reload(); } }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        document.getElementById('workoutForm').onsubmit = (e) => {
            e.preventDefault();
            const type = document.getElementById('wType').value;
            const dur = Number(document.getElementById('wDuration').value) || 30;
            const cals = Number(document.getElementById('wCalories').value) || 200;
            state.workouts.unshift({ id: Date.now(), title: type, duration: dur, calories: cals, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
            save(); closeModal('modalWorkout');
        };

        let myChart = null;
        function renderChart() {
            const ctx = document.getElementById('chartSteps');
            if (!ctx) return;
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Thu', 'Fri', 'Sat', 'Sun', 'Mon', 'Tue', 'Today'],
                    datasets: [{ label: 'Steps', data: [8400, 9100, 11200, 6500, 10400, 8900, state.steps], backgroundColor: '#10b981', borderRadius: 6 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        updateUI();
    </script>
</body>
</html>
